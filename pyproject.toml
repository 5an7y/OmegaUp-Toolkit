[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "omegaup-toolkit"
version = "0.1.0"
description = "Toolkit for creating and testing competitive programming problems for OmegaUp"
requires-python = ">=3.6"
dependencies = ["tqdm", "omegaup>=2.0.17", "pyyaml", "questionary"]

[tool.setuptools.packages.find]
include = ["omegaup_toolkit*"]

[project.scripts]
omegaup = "omegaup_toolkit.cli:main"
